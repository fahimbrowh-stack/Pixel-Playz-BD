<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Playz BD | aRIFIN</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* Full Screen Background Video with Blur */
        .video-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -2;
            overflow: hidden;
        }

        .video-bg {
            width: 100%; height: 100%;
            object-fit: cover;
            /* 20% Blur and Brightness control */
            filter: blur(8px) brightness(0.5); 
            transform: scale(1.1); /* Blur edge gulo thik korar jonno halka scale */
        }

        /* Dark Overlay for better contrast */
        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.2);
            z-index: -1;
        }

        /* Glassmorphism Card Design */
        .card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            padding: 40px 25px;
            text-align: center;
            color: white;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
        }

        .profile-img {
            width: 115px; height: 115px;
            border-radius: 50%;
            border: 3px solid #fff;
            margin-bottom: 10px;
            object-fit: cover;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        /* Brand Name under Profile Pic */
        .brand-name {
            font-size: 20px;
            font-weight: bold;
            color: #00d2ff;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.6);
        }

        h1 { font-size: 26px; letter-spacing: 2px; margin-bottom: 10px; }
        .bio { font-size: 14px; opacity: 0.9; line-height: 1.5; margin-bottom: 25px; }

        /* Social Icons with Real Colors & Glowing Effect */
        .social-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .social-icon {
            text-decoration: none;
            font-size: 20px;
            width: 45px; height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            transition: all 0.4s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Specific Glowing Colors */
        .yt:hover { color: #FF0000; box-shadow: 0 0 20px #FF0000; background: #fff; }
        .fb:hover { color: #1877F2; box-shadow: 0 0 20px #1877F2; background: #fff; }
        .dc:hover { color: #5865F2; box-shadow: 0 0 20px #5865F2; background: #fff; }
        .gp:hover { color: #20b3ff; box-shadow: 0 0 20px #20b3ff; background: #fff; }
        .ig:hover { color: #E4405F; box-shadow: 0 0 20px #E4405F; background: #fff; }
        .gm:hover { color: #DB4437; box-shadow: 0 0 20px #DB4437; background: #fff; }
        .ps:hover { color: #00ffcc; box-shadow: 0 0 20px #00ffcc; background: #fff; }

        .social-icon i { transition: transform 0.3s; }
        .social-icon:hover i { transform: scale(1.2); }

        /* Music Player UI */
        .player-box {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 15px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .music-info { font-size: 12px; text-align: left; }
    </style>
</head>
<body>

    <div class="video-container">
        <video class="video-bg" autoplay muted loop playsinline>
            <source src="https://cdn.kapwing.com/final_6a05a475dc052632f9c6ea60_5131481514.mp4" type="video/mp4">
        </video>
    </div>
    <div class="overlay"></div>

    <div class="card">
        <img src="https://i.postimg.cc/tgvv6tc7/IMG-3920.jpg" alt="aRIFIN" class="profile-img">
        <div class="brand-name">Pixel Playz BD</div>
        
        <h1>aRIFIN</h1>
        <p class="bio">"Hello everyone..!! I am Arifin, The Founder of Pixel Playz BD. Stay connected with me through the links below! :)"</p>

        <div class="social-container">
            <a href="https://www.youtube.com/@PixelPlayzBD" target="_blank" class="social-icon yt"><i class="fab fa-youtube"></i></a>
            <a href="https://www.facebook.com/PixelPlayzOfficial" target="_blank" class="social-icon fb"><i class="fab fa-facebook-f"></i></a>
            <a href="https://discord.com/invite/VrtYPZja" target="_blank" class="social-icon dc"><i class="fab fa-discord"></i></a>
            <a href="https://www.facebook.com/groups/805263295338049" target="_blank" class="social-icon gp"><i class="fas fa-users"></i></a>
            <a href="https://www.instagram.com/pixel.playz.official" target="_blank" class="social-icon ig"><i class="fab fa-instagram"></i></a>
            <a href="mailto:pixbhaiofficial@gmail.com" class="social-icon gm"><i class="fas fa-envelope"></i></a>
            <a href="https://www.facebook.com/iamarifin778" target="_blank" class="social-icon ps"><i class="fas fa-user-check"></i></a>
        </div>

        <div class="player-box">
            <div class="music-info">
                <p>🎵 Playing: Pixel Playz Theme</p>
            </div>
            <audio id="bgMusic" loop>
                <source src="https://www.image2url.com/r2/default/audio/1778752716714-a09dc305-89f6-48aa-84b0-c35aabae4564.mp3" type="audio/mpeg">
            </audio>
            <button onclick="togglePlay()" style="background:none; border:none; color:white; cursor:pointer; font-size: 20px;">
                <i id="playIcon" class="fas fa-play"></i>
            </button>
        </div>
    </div>

    <script>
        var music = document.getElementById("bgMusic");
        var icon = document.getElementById("playIcon");

        function togglePlay() {
            if (music.paused) {
                music.play();
                icon.className = "fas fa-pause";
            } else {
                music.pause();
                icon.className = "fas fa-play";
            }
        }
        
        // Music start on click
        document.body.addEventListener('click', function() {
            if (music.paused) {
                music.play();
                icon.className = "fas fa-pause";
            }
        }, { once: true });
    </script>

</body>
</html>

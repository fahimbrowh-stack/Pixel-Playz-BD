<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Playz BD | Bio Link</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        /* YouTube Background[span_3](start_span)[span_3](end_span) */
        .video-background {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -2;
            pointer-events: none;
            overflow: hidden;
        }

        .video-background iframe {
            width: 100vw;
            height: 56.25vw; 
            min-height: 100vh;
            min-width: 177.77vh; 
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            filter: blur(10px) brightness(0.5);
        }

        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.2);
            z-index: -1;
        }

        /* Glassmorphism Card[span_4](start_span)[span_4](end_span)[span_5](start_span)[span_5](end_span) */
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 35px;
            padding: 40px 20px;
            text-align: center;
            color: white;
            width: 90%;
            max-width: 440px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            z-index: 1;
        }

        .profile-img {
            width: 110px; height: 110px;
            border-radius: 50%;
            border: 3px solid #fff;
            margin-bottom: 15px;
        }

        .brand-name {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .bio { font-size: 14px; margin-bottom: 20px; opacity: 0.9; }

        /* Permanent Glowing Icons (image_4.png style)[span_6](start_span)[span_6](end_span) */
        .social-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 35px;
        }

        .social-icon {
            text-decoration: none;
            font-size: 22px;
            width: 45px; height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: 0.3s;
            background: #fff; /* Icons background white like image_4.png[span_7](start_span)[span_7](end_span) */
        }

        /* Specific Brand Colors and Permanent Glow[span_8](start_span)[span_8](end_span) */
        .yt { color: #ff0000; box-shadow: 0 0 15px #ff0000; }
        .fb { color: #1877f2; box-shadow: 0 0 15px #1877f2; }
        .dc { color: #5865f2; box-shadow: 0 0 15px #5865f2; }
        .ig { color: #e4405f; box-shadow: 0 0 15px #e4405f; }
        .gm { color: #db4437; box-shadow: 0 0 15px #db4437; }
        .ps { color: #00ffcc; box-shadow: 0 0 15px #00ffcc; }

        .player-box {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 20px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <div class="video-background">
        <iframe src="https://www.youtube-nocookie.com/embed/Ulm_Z646eBg?autoplay=1&mute=1&loop=1&playlist=Ulm_Z646eBg&controls=0&showinfo=0&rel=0&iv_load_policy=3&modestbranding=1" frameborder="0" allow="autoplay; encrypted-media"></iframe>
    </div>
    <div class="overlay"></div>

    <div class="card">
        <img src="https://i.postimg.cc/tgvv6tc7/IMG-3920.jpg" class="profile-img">
        <div class="brand-name">Pixel Playz BD</div>
        
        <p class="bio">"Hello everyone..!! I am Arifin, Founder of Pixel Playz BD. Stay connected!"</p>

        <div class="social-container">
            <a href="https://www.youtube.com/@PixelPlayzBD" target="_blank" class="social-icon yt"><i class="fab fa-youtube"></i></a>
            <a href="https://www.facebook.com/PixelPlayzOfficial" target="_blank" class="social-icon fb"><i class="fab fa-facebook-f"></i></a>
            <a href="https://discord.com/invite/VrtYPZja" target="_blank" class="social-icon dc"><i class="fab fa-discord"></i></a>
            <a href="https://www.facebook.com/groups/805263295338049" target="_blank" class="social-icon fb"><i class="fas fa-users"></i></a>
            <a href="https://www.instagram.com/pixel.playz.official" target="_blank" class="social-icon ig"><i class="fab fa-instagram"></i></a>
            <a href="mailto:pixbhaiofficial@gmail.com" class="social-icon gm"><i class="fas fa-envelope"></i></a>
            <a href="https://www.facebook.com/iamarifin778" target="_blank" class="social-icon ps"><i class="fas fa-user-check"></i></a>
        </div>

        <div class="player-box">
            <div style="font-size: 12px; text-align: left;">
                <p>🎵 Pixel Playz Theme</p>
                <p style="opacity: 0.6;">0:26 / 0:46</p>
            </div>
            <audio id="bgMusic" loop>
                <source src="https://www.image2url.com/r2/default/audio/1778752716714-a09dc305-89f6-48aa-84b0-c35aabae4564.mp3" type="audio/mpeg">
            </audio>
            <button onclick="togglePlay()" style="background:none; border:none; color:white; cursor:pointer; font-size: 20px;">
                <i id="playIcon" class="fas fa-play"></i>
            </button>
        </div>
    </div>

    <script>
        var music = document.getElementById("bgMusic");
        var icon = document.getElementById("playIcon");
        function togglePlay() {
            if (music.paused) { music.play(); icon.className = "fas fa-pause"; }
            else { music.pause(); icon.className = "fas fa-play"; }
        }
        document.body.addEventListener('click', function() { 
            if (music.paused) { music.play(); icon.className = "fas fa-pause"; } 
        }, { once: true });
    </script>
</body>
</html>

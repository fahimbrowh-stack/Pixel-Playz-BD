<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aRIFIN | Pixel Playz BD</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* Full Screen Banner Background */
        .bg-banner {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            object-fit: cover;
            filter: brightness(0.6); /* Jate lekha gulo bhalo bujha jay */
        }

        /* Glassmorphism Card Design */
        .card {
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            padding: 40px 20px;
            text-align: center;
            color: white;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
        }

        /* Profile Image Updated */
        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.8);
            margin-bottom: 15px;
            object-fit: cover;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        h1 { font-size: 28px; letter-spacing: 2px; margin-bottom: 10px; text-transform: uppercase; }
        .bio { font-size: 14px; opacity: 0.9; line-height: 1.5; margin-bottom: 10px; }
        .location { font-size: 13px; margin-bottom: 25px; color: #ccc; }

        /* Social Icons */
        .social-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .social-icon {
            text-decoration: none;
            color: white;
            font-size: 20px;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .social-icon:hover {
            transform: scale(1.1);
            background: #fff;
            color: #000;
        }

        /* Music Player UI */
        .player-box {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .music-info { font-size: 12px; text-align: left; }
    </style>
</head>
<body>

    <!-- Banner PNG Background -->
    <img class="bg-banner" src="https://i.postimg.cc/VLMVrt1D/IMG-3922.png" alt="banner">

    <div class="card">
        <!-- Profile Image Added -->
        <img src="https://i.postimg.cc/tgvv6tc7/IMG-3920.jpg" alt="aRIFIN" class="profile-img">
        
        <h1>aRIFIN</h1>
        <p class="bio">"Hello everyone..!! I am Arifin, The Founder of Pixel Playz BD. You can find me here and stay connected with me through the links below! :)"</p>
        <p class="location"><i class="fa-solid fa-location-dot"></i> Dhaka, Bangladesh, Earth :)</p>

        <div class="social-container">
            <a href="https://www.youtube.com/@PixelPlayzBD" target="_blank" class="social-icon"><i class="fab fa-youtube"></i></a>
            <a href="https://www.facebook.com/PixelPlayzOfficial" target="_blank" class="social-icon"><i class="fab fa-facebook-f"></i></a>
            <a href="https://discord.com/invite/VrtYPZja" target="_blank" class="social-icon"><i class="fab fa-discord"></i></a>
            <a href="https://www.facebook.com/groups/805263295338049" target="_blank" class="social-icon"><i class="fas fa-users"></i></a>
            <a href="https://www.instagram.com/pixel.playz.official" target="_blank" class="social-icon"><i class="fab fa-instagram"></i></a>
            <a href="mailto:pixbhaiofficial@gmail.com" class="social-icon"><i class="fas fa-envelope"></i></a>
            <a href="https://www.facebook.com/iamarifin778" target="_blank" class="social-icon"><i class="fas fa-user"></i></a>
        </div>

        <div class="player-box">
            <div class="music-info">
                <p>🎵 Now Playing...</p>
                <p style="opacity: 0.6;">Pixel Playz Audio</p>
            </div>
            <audio id="bgMusic" loop>
                <source src="https://www.image2url.com/r2/default/audio/1778752716714-a09dc305-89f6-48aa-84b0-c35aabae4564.mp3" type="audio/mpeg">
            </audio>
            <button onclick="togglePlay()" style="background:none; border:none; color:white; cursor:pointer; font-size: 20px;">
                <i id="playIcon" class="fas fa-play"></i>
            </button>
        </div>
    </div>

    <script>
        var music = document.getElementById("bgMusic");
        var icon = document.getElementById("playIcon");

        function togglePlay() {
            if (music.paused) {
                music.play();
                icon.classList.replace("fa-play", "fa-pause");
            } else {
                music.pause();
                icon.classList.replace("fa-pause", "fa-play");
            }
        }
        
        // Music auto-play logic
        document.body.addEventListener('click', function() {
            if (music.paused) {
                music.play();
                icon.classList.replace("fa-play", "fa-pause");
            }
        }, { once: true });
    </script>

</body>
</html>

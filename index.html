<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Playz BD | Bio Link</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        /* Video Background Fix[span_4](start_span)[span_4](end_span) */
        .video-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -2;
            background: #000; /* Video load na hole black thakbe */
        }

        .video-bg {
            width: 100%; height: 100%;
            object-fit: cover;
            filter: blur(10px) brightness(0.6); /* 20% Blur[span_5](start_span)[span_5](end_span) */
            transform: scale(1.1);
        }

        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.2);
            z-index: -1;
        }

        /* Glassmorphism Card[span_6](start_span)[span_6](end_span)[span_7](start_span)[span_7](end_span) */
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 35px;
            padding: 40px 20px;
            text-align: center;
            color: white;
            width: 90%;
            max-width: 440px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .profile-img {
            width: 110px; height: 110px;
            border-radius: 50%;
            border: 3px solid #fff;
            margin-bottom: 15px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        /* Brand Name[span_8](start_span)[span_8](end_span) */
        .brand-name {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        .bio { font-size: 14px; line-height: 1.4; margin-bottom: 20px; opacity: 0.9; }
        .location { font-size: 13px; margin-bottom: 30px; }

        /* Social Icons with Real Colors & Glow[span_9](start_span)[span_9](end_span)[span_10](start_span)[span_10](end_span) */
        .social-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 35px;
        }

        .social-icon {
            text-decoration: none;
            font-size: 22px;
            width: 42px; height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: 0.4s;
            background: rgba(0, 0, 0, 0.3);
        }

        /* Glowing Colors[span_11](start_span)[span_11](end_span) */
        .yt { color: #ff0000; border: 1px solid #ff0000; }
        .yt:hover { box-shadow: 0 0 20px #ff0000; background: #ff0000; color: #fff; }

        .fb { color: #1877f2; border: 1px solid #1877f2; }
        .fb:hover { box-shadow: 0 0 20px #1877f2; background: #1877f2; color: #fff; }

        .dc { color: #5865f2; border: 1px solid #5865f2; }
        .dc:hover { box-shadow: 0 0 20px #5865f2; background: #5865f2; color: #fff; }

        .ig { color: #e4405f; border: 1px solid #e4405f; }
        .ig:hover { box-shadow: 0 0 20px #e4405f; background: #e4405f; color: #fff; }

        .gm { color: #db4437; border: 1px solid #db4437; }
        .gm:hover { box-shadow: 0 0 20px #db4437; background: #db4437; color: #fff; }

        .ps { color: #00ffcc; border: 1px solid #00ffcc; }
        .ps:hover { box-shadow: 0 0 20px #00ffcc; background: #00ffcc; color: #fff; }

        /* Music Player Box[span_12](start_span)[span_12](end_span) */
        .player-box {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 20px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <!-- Direct MP4 Video Fix[span_13](start_span)[span_13](end_span) -->
        <video class="video-bg" autoplay muted loop playsinline>
            <source src="https://cdn.kapwing.com/final_6a05a475dc052632f9c6ea60_5131481514.mp4" type="video/mp4">
        </video>
    </div>
    <div class="overlay"></div>

    <div class="card">
        <img src="https://i.postimg.cc/tgvv6tc7/IMG-3920.jpg" class="profile-img">
        <div class="brand-name">Pixel Playz BD</div>
        
        <p class="bio">"Hello everyone..!! I am Arifin, Founder of Pixel Playz BD. Stay connected with me through the links below! :)&darr;"</p>
        <p class="location"><i class="fa-solid fa-location-dot"></i> Dhaka, Bangladesh, Earth :)</p>

        <div class="social-container">
            <a href="https://www.youtube.com/@PixelPlayzBD" target="_blank" class="social-icon yt"><i class="fab fa-youtube"></i></a>
            <a href="https://www.facebook.com/PixelPlayzOfficial" target="_blank" class="social-icon fb"><i class="fab fa-facebook-f"></i></a>
            <a href="https://discord.com/invite/VrtYPZja" target="_blank" class="social-icon dc"><i class="fab fa-discord"></i></a>
            <a href="https://www.facebook.com/groups/805263295338049" target="_blank" class="social-icon fb"><i class="fas fa-users"></i></a>
            <a href="https://www.instagram.com/pixel.playz.official" target="_blank" class="social-icon ig"><i class="fab fa-instagram"></i></a>
            <a href="mailto:pixbhaiofficial@gmail.com" class="social-icon gm"><i class="fas fa-envelope"></i></a>
            <a href="https://www.facebook.com/iamarifin778" target="_blank" class="social-icon ps"><i class="fas fa-user-check"></i></a>
        </div>

        <div class="player-box">
            <div style="font-size: 12px; text-align: left;">
                <p>🎵 Pixel Playz Theme</p>
                <p style="opacity: 0.6;">0:26 / 0:46</p>
            </div>
            <audio id="bgMusic" loop>
                <source src="https://www.image2url.com/r2/default/audio/1778752716714-a09dc305-89f6-48aa-84b0-c35aabae4564.mp3" type="audio/mpeg">
            </audio>
            <button onclick="togglePlay()" style="background:none; border:none; color:white; cursor:pointer; font-size: 20px;">
                <i id="playIcon" class="fas fa-play"></i>
            </button>
        </div>
    </div>

    <script>
        var music = document.getElementById("bgMusic");
        var icon = document.getElementById("playIcon");
        function togglePlay() {
            if (music.paused) { music.play(); icon.className = "fas fa-pause"; }
            else { music.pause(); icon.className = "fas fa-play"; }
        }
        document.body.addEventListener('click', function() { if (music.paused) { music.play(); icon.className = "fas fa-pause"; } }, { once: true });
    </script>
</body>
</html>
